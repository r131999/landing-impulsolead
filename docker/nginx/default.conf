server {
    listen 80;
    server_name impulsoleadcrm.com.br www.impulsoleadcrm.com.br;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # O container só é acessado através do nginx do host (reverse proxy).
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    # Assets com hash no nome (gerados pelo build) podem ser cacheados por muito tempo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # HTML nunca deve ficar em cache, pra não prender um deploy novo atrás do cache do navegador.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location = /favicon.svg {
        add_header Cache-Control "public, max-age=604800" always;
    }
}
