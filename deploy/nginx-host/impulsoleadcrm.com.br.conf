# Modelo do vhost do NGINX DO HOST (não roda em container) para impulsoleadcrm.com.br.
#
# Este arquivo é referência/histórico versionado — não é aplicado automaticamente.
# Copie o conteúdo pra /etc/nginx/sites-available/impulsoleadcrm.com.br na VPS
# e ative um symlink em sites-enabled. Depois de validar em HTTP, rode
# `certbot --nginx -d impulsoleadcrm.com.br` (ver deploy/DEPLOY.md) — o certbot
# reescreve este arquivo automaticamente para adicionar o bloco `listen 443 ssl`
# e o redirect 80 -> 443.
#
# Troque <HOST_PORT> pela porta livre escolhida na VPS para o container
# (docker ps / ss -tlnp antes de decidir — não assuma 8080 livre).

server {
    listen 80;
    listen [::]:80;
    server_name impulsoleadcrm.com.br www.impulsoleadcrm.com.br;

    location / {
        proxy_pass http://127.0.0.1:<HOST_PORT>;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
